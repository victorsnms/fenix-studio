<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fenix Studios</title>

    <!-- Baseline social share metadata. WhatsApp/Instagram/Facebook's link-preview
         crawlers fetch this raw HTML and never run JavaScript, so the per-page
         <Helmet> tags in src/components/Seo/ (rendered client-side) are invisible to
         them — every shared link needs something here regardless of which page. This
         is intentionally the same for every route; true per-page previews would need
         server-side rendering or a crawler-specific prerender, out of scope for now. -->
    <meta name="description" content="A Fenix Studios é um estúdio de pós-produção e efeitos visuais (VFX) especializado em transformar imaginação em imagem para cinema, streaming e publicidade." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fenix Studios" />
    <meta property="og:url" content="https://fenixstudios.com.br/" />
    <meta property="og:title" content="Fenix Studios" />
    <meta property="og:description" content="A Fenix Studios é um estúdio de pós-produção e efeitos visuais (VFX) especializado em transformar imaginação em imagem para cinema, streaming e publicidade." />
    <meta property="og:image" content="https://fenixstudios.com.br/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fenix Studios" />
    <meta name="twitter:description" content="A Fenix Studios é um estúdio de pós-produção e efeitos visuais (VFX) especializado em transformar imaginação em imagem para cinema, streaming e publicidade." />
    <meta name="twitter:image" content="https://fenixstudios.com.br/og-image.png" />

    <!-- Organization structured data. This is a business homepage, not a blog post, so
         it has no real single "author" or "publish date" — the article:* OG fields some
         crawlers (LinkedIn) look for don't semantically apply here. schema.org
         Organization is the correct way to give crawlers a real entity (name, logo, url)
         to associate with the page instead of fabricating article-specific fields. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Fenix Studios",
        "url": "https://fenixstudios.com.br/",
        "logo": "https://fenixstudios.com.br/brand-logo.png",
        "description": "A Fenix Studios é um estúdio de pós-produção e efeitos visuais (VFX) especializado em transformar imaginação em imagem para cinema, streaming e publicidade."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
